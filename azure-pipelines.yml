trigger: none
pool: Default
 

steps:
 - task: TerraformInstaller@1
   inputs:
     terraformVersion: 'latest'
 - task: TerraformTask@5
   displayName: terraform FMT
   inputs:
     provider: 'azurerm'
     command: 'custom'
     outputTo: 'console'
     customCommand: 'fmt'
     environmentServiceNameAzureRM: 'sep-serviceconection'
 - task: TerraformTask@5
   displayName: terraform validate
   inputs:
     provider: 'azurerm'
     command: 'validate'
  



