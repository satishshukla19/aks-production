trigger: none
pool: Default


steps:
 - task: TerraformInstaller@1
   inputs:
     terraformVersion: 'latest'
 - task: TerraformTask@5
   displayName: terraform FMT
   inputs:
     provider: 'azurerm'
     command: 'custom'
     outputTo: 'console'
     customCommand: 'fmt'
     environmentServiceNameAzureRM: 'sep-serviceconection'

 - task: TerraformTask@5
   displayName: terraform init
   inputs:
     provider: 'azurerm'
     command: 'init'
     backendServiceArm: 'sep-serviceconection'
     backendAzureRmResourceGroupName: 'Ali-test'
     backendAzureRmStorageAccountName: 'nahid0562'
     backendAzureRmContainerName: 'adostatefiles'
     backendAzureRmKey: 'landing-zone.infra.tfstate'
  

 - task: TerraformTask@5
   displayName: terraform validate
   inputs:
     provider: 'azurerm'
     command: 'validate'
 
 - task: TerraformTask@5
   displayName: terraform plan
   inputs:
     provider: 'azurerm'
     command: 'plan'
     environmentServiceNameAzureRM: 'sep-serviceconection'
    
 - task: TerraformTask@5
   displayName: terraform apply
   inputs:
     provider: 'azurerm'
     command: 'apply'
     environmentServiceNameAzureRM: 'sep-serviceconection'

 - task: TerraformTask@5
   displayName: destroy
   inputs:
     provider: 'azurerm'
     command: 'destroy'
     environmentServiceNameAzureRM: 'sep-serviceconection'
  



